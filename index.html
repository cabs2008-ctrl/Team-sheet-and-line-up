<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAA Team Lineup</title>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial;
}

/* HEADER */
.header {
  margin: 20px;
}

#teamName {
  font-size: 24px;
  font-weight: bold;
  padding: 8px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

/* PITCH */
.pitch {
  width: 350px;
  height: 600px;
  background: #e0e0e0;
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

/* LINES */
.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* PLAYER */
.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
  z-index: 1;
}

.jersey {
  width: 45px;
  height: 45px;
}

.number {
  fill: white;
  font-size: 14px;
  font-weight: bold;
  text-anchor: middle;
  dominant-baseline: middle;
}

.name {
  background: #2e7d32;
  color: white;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 12px;
  margin-top: 4px;
}

/* FORMATION (same as before) */
.p1 { bottom: 10px; left: 50%; transform: translateX(-50%); }
.p2 { bottom: 100px; right: 20px; }
.p3 { bottom: 100px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 100px; left: 20px; }
.p5 { bottom: 180px; right: 20px; }
.p6 { bottom: 180px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 180px; left: 20px; }
.p8 { bottom: 260px; right: 60px; }
.p9 { bottom: 260px; left: 60px; }
.p10 { bottom: 340px; right: 20px; }
.p11 { bottom: 340px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 340px; left: 20px; }
.p13 { top: 40px; right: 20px; }
.p14 { top: 40px; left: 50%; transform: translateX(-50%); }
.p15 { top: 40px; left: 20px; }

</style>
</head>

<body>

<div class="header">
  <input id="teamName" placeholder="Enter Team Name">
</div>

<div class="pitch" id="pitch">

<svg class="lines" viewBox="0 0 100 160" preserveAspectRatio="none">

  <!-- Outer -->
  <rect x="1" y="1" width="98" height="158" fill="none" stroke="#bdbdbd"/>

  <!-- Halfway -->
  <line x1="0" y1="80" x2="100" y2="80" stroke="#bdbdbd"/>

  <!-- 45m lines -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#bdbdbd"/>
  <line x1="0" y1="110" x2="100" y2="110" stroke="#bdbdbd"/>

  <!-- 20m lines -->
  <line x1="0" y1="25" x2="100" y2="25" stroke="#bdbdbd"/>
  <line x1="0" y1="135" x2="100" y2="135" stroke="#bdbdbd"/>

  <!-- Big rectangle -->
  <rect x="25" y="1" width="50" height="40" fill="none" stroke="#bdbdbd"/>
  <rect x="25" y="119" width="50" height="40" fill="none" stroke="#bdbdbd"/>

  <!-- Small rectangle -->
  <rect x="35" y="1" width="30" height="20" fill="none" stroke="#bdbdbd"/>
  <rect x="35" y="139" width="30" height="20" fill="none" stroke="#bdbdbd"/>

  <!-- Semi circles -->
  <path d="M25,40 A25,25 0 0 0 75,40" fill="none" stroke="#bdbdbd"/>
  <path d="M25,120 A25,25 0 0 1 75,120" fill="none" stroke="#bdbdbd"/>

  <!-- Goals -->
  <line x1="40" y1="1" x2="40" y2="8" stroke="#bdbdbd"/>
  <line x1="60" y1="1" x2="60" y2="8" stroke="#bdbdbd"/>
  <line x1="40" y1="159" x2="40" y2="152" stroke="#bdbdbd"/>
  <line x1="60" y1="159" x2="60" y2="152" stroke="#bdbdbd"/>

</svg>

</div>

<script>
const defaultPlayers = Array(15).fill("Player");
defaultPlayers[0] = "Goalkeeper";

let players = JSON.parse(localStorage.getItem("team")) || defaultPlayers;
let teamName = localStorage.getItem("teamName") || "";

const pitch = document.getElementById("pitch");
const teamInput = document.getElementById("teamName");

teamInput.value = teamName;
teamInput.oninput = () => localStorage.setItem("teamName", teamInput.value);

function jerseySVG(number) {
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
          fill="#8b0000"/>
    <text x="32" y="32" class="number">${number}</text>
  </svg>`;
}

function render() {
  document.querySelectorAll(".player").forEach(e => e.remove());

  players.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "player p" + (i + 1);

    div.innerHTML = `
      ${jerseySVG(i+1)}
      <div class="name">${name}</div>
    `;

    div.onclick = () => {
      const n = prompt("Edit player:", name);
      if (n && n.trim()) {
        players[i] = n;
        localStorage.setItem("team", JSON.stringify(players));
        render();
      }
    };

    pitch.appendChild(div);
  });
}

render();
</script>

</body>
</html>
