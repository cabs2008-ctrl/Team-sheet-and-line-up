<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAA Lineup (Spec Accurate)</title>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial;
}

.header { margin: 20px; }

#teamName {
  font-size: 24px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

/* PITCH */
.pitch {
  width: 360px;
  height: 560px; /* 140:90 ratio */
  background: #e6e6e6;
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
  z-index: 1;
}

.jersey { width: 40px; height: 40px; }

.number {
  fill: white;
  font-size: 13px;
  font-weight: bold;
  text-anchor: middle;
  dominant-baseline: middle;
}

.name {
  background: #2e7d32;
  color: white;
  padding: 2px 6px;
  border-radius: 10px;
  font-size: 11px;
  margin-top: 3px;
}

/* FORMATION scaled to new pitch */
.p1 { bottom: 8px; left: 50%; transform: translateX(-50%); }
.p2 { bottom: 90px; right: 20px; }
.p3 { bottom: 90px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 90px; left: 20px; }
.p5 { bottom: 170px; right: 20px; }
.p6 { bottom: 170px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 170px; left: 20px; }
.p8 { bottom: 250px; right: 60px; }
.p9 { bottom: 250px; left: 60px; }
.p10 { bottom: 330px; right: 20px; }
.p11 { bottom: 330px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 330px; left: 20px; }
.p13 { top: 50px; right: 20px; }
.p14 { top: 50px; left: 50%; transform: translateX(-50%); }
.p15 { top: 50px; left: 20px; }

</style>
</head>

<body>

<div class="header">
  <input id="teamName" placeholder="Team Name">
</div>

<div class="pitch" id="pitch">

<!-- TRUE SCALE: 140m length, 90m width -->
<svg class="lines" viewBox="0 0 90 140" preserveAspectRatio="none">

  <!-- BORDER -->
  <rect x="0.5" y="0.5" width="89" height="139" fill="none" stroke="#bdbdbd"/>

  <!-- HALF WAY (70m) -->
  <line x1="0" y1="70" x2="90" y2="70" stroke="#bdbdbd"/>

  <!-- 45m -->
  <line x1="0" y1="45" x2="90" y2="45" stroke="#bdbdbd"/>
  <line x1="0" y1="95" x2="90" y2="95" stroke="#bdbdbd"/>

  <!-- 20m -->
  <line x1="0" y1="20" x2="90" y2="20" stroke="#bdbdbd"/>
  <line x1="0" y1="120" x2="90" y2="120" stroke="#bdbdbd"/>

  <!-- 13m -->
  <line x1="0" y1="13" x2="90" y2="13" stroke="#bdbdbd"/>
  <line x1="0" y1="127" x2="90" y2="127" stroke="#bdbdbd"/>

  <!-- LARGE RECT (13m deep, 40m wide) -->
  <rect x="25" y="0" width="40" height="13" fill="none" stroke="#bdbdbd"/>
  <rect x="25" y="127" width="40" height="13" fill="none" stroke="#bdbdbd"/>

  <!-- SMALL RECT (4.5m deep, 14m wide approx scaled) -->
  <rect x="38" y="0" width="14" height="4.5" fill="none" stroke="#bdbdbd"/>
  <rect x="38" y="135.5" width="14" height="4.5" fill="none" stroke="#bdbdbd"/>

  <!-- ARC (20m radius from goal centre) -->
  <!-- TOP -->
  <path d="
    M 25 20
    A 20 20 0 0 0 65 20
  " fill="none" stroke="#bdbdbd"/>

  <!-- BOTTOM -->
  <path d="
    M 25 120
    A 20 20 0 0 1 65 120
  " fill="none" stroke="#bdbdbd"/>

  <!-- GOALS WITH NET -->
  <!-- TOP -->
  <rect x="43" y="-3" width="4" height="3" fill="none" stroke="#bdbdbd"/> <!-- net depth -->
  <line x1="43" y1="0" x2="43" y2="7" stroke="#bdbdbd"/>
  <line x1="47" y1="0" x2="47" y2="7" stroke="#bdbdbd"/>
  <line x1="43" y1="7" x2="47" y2="7" stroke="#bdbdbd"/>

  <!-- BOTTOM -->
  <rect x="43" y="140" width="4" height="3" fill="none" stroke="#bdbdbd"/>
  <line x1="43" y1="140" x2="43" y2="133" stroke="#bdbdbd"/>
  <line x1="47" y1="140" x2="47" y2="133" stroke="#bdbdbd"/>
  <line x1="43" y1="133" x2="47" y2="133" stroke="#bdbdbd"/>

</svg>

</div>

<script>
let players = JSON.parse(localStorage.getItem("team")) || Array(15).fill("Player");
players[0] = players[0] || "Goalkeeper";

let teamName = localStorage.getItem("teamName") || "";

const pitch = document.getElementById("pitch");
const input = document.getElementById("teamName");

input.value = teamName;
input.oninput = () => localStorage.setItem("teamName", input.value);

function jersey(n) {
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
    fill="#8b0000"/>
    <text x="32" y="32" class="number">${n}</text>
  </svg>`;
}

function render() {
  document.querySelectorAll(".player").forEach(e => e.remove());

  players.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "player p" + (i+1);
    d.innerHTML = jersey(i+1) + `<div class="name">${name}</div>`;

    d.onclick = () => {
      let n = prompt("Edit player:", name);
      if (n && n.trim()) {
        players[i] = n;
        localStorage.setItem("team", JSON.stringify(players));
        render();
      }
    };

    pitch.appendChild(d);
  });
}

render();
</script>

</body>
</html>
