<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAA Lineup</title>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial;
}

.header {
  margin: 20px;
  text-align: center;
}

#teamName {
  font-size: 22px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
}

/* BUTTONS */
.btn {
  padding: 8px 12px;
  margin: 4px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: white;
}

.save { background: #1565c0; }
.reload { background: #2e7d32; }
.reset { background: #c62828; }
.download { background: #ff9800; }
.share { background: #25D366; }

#msg {
  margin-top: 6px;
  font-size: 12px;
}

/* PITCH */
.pitch {
  width: 360px;
  height: 560px;
  background: repeating-linear-gradient(
    to bottom,
    #4caf50 0px,
    #4caf50 40px,
    #43a047 40px,
    #43a047 80px
  );
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.lines * {
  stroke: white;
  stroke-width: 0.6;
  fill: none;
}

.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
  z-index: 1;
}

.jersey { width: 40px; height: 40px; }

.number {
  fill: white;
  font-size: 13px;
  font-weight: bold;
  text-anchor: middle;
  dominant-baseline: middle;
}

.name {
  background: #1b5e20;
  color: white;
  padding: 2px 6px;
  border-radius: 10px;
  font-size: 11px;
  margin-top: 3px;
}

/* POSITIONS */
.p1 { bottom: 8px; left: 50%; transform: translateX(-50%); }
.p2 { bottom: 90px; right: 20px; }
.p3 { bottom: 90px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 90px; left: 20px; }
.p5 { bottom: 170px; right: 20px; }
.p6 { bottom: 170px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 170px; left: 20px; }
.p8 { bottom: 250px; right: 60px; }
.p9 { bottom: 250px; left: 60px; }
.p10 { bottom: 330px; right: 20px; }
.p11 { bottom: 330px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 330px; left: 20px; }
.p13 { top: 50px; right: 20px; }
.p14 { top: 50px; left: 50%; transform: translateX(-50%); }
.p15 { top: 50px; left: 20px; }

</style>
</head>

<body>

<div class="header">
  <input id="teamName" placeholder="Team Name"><br>

  <button class="btn save" onclick="saveData()">Save</button>
  <button class="btn reload" onclick="reloadData()">Reload</button>
  <button class="btn reset" onclick="resetAll()">Reset</button>
  <button class="btn download" onclick="downloadImage()">Download</button>
  <button class="btn share" onclick="shareImage()">Share</button>

  <br>
  Jersey Color: <input type="color" id="colorPicker">

  <div id="msg"></div>
</div>

<div class="pitch" id="pitch">

<svg class="lines" viewBox="0 0 90 140">

  <rect x="0" y="0" width="90" height="140"/>
  <line x1="0" y1="70" x2="90" y2="70"/>

  <line x1="0" y1="45" x2="90" y2="45"/>
  <line x1="0" y1="95" x2="90" y2="95"/>

  <line x1="0" y1="20" x2="90" y2="20"/>
  <line x1="0" y1="120" x2="90" y2="120"/>

  <line x1="0" y1="13" x2="90" y2="13"/>
  <line x1="0" y1="127" x2="90" y2="127"/>

  <rect x="25" y="0" width="40" height="13"/>
  <rect x="25" y="127" width="40" height="13"/>

  <rect x="38" y="0" width="14" height="4.5"/>
  <rect x="38" y="135.5" width="14" height="4.5"/>

  <path d="M25 20 A20 20 0 0 0 65 20"/>
  <path d="M25 120 A20 20 0 0 1 65 120"/>

</svg>

</div>

<script>
const defaultPlayers = Array(15).fill("Player");
defaultPlayers[0] = "Goalkeeper";

let players = JSON.parse(localStorage.getItem("team")) || [...defaultPlayers];
let jerseyColor = localStorage.getItem("jerseyColor") || "#8b0000";

const pitch = document.getElementById("pitch");
const input = document.getElementById("teamName");
const msg = document.getElementById("msg");
const colorPicker = document.getElementById("colorPicker");

input.value = localStorage.getItem("teamName") || "";
colorPicker.value = jerseyColor;

/* SAVE */
function saveData() {
  localStorage.setItem("team", JSON.stringify(players));
  localStorage.setItem("teamName", input.value);
  localStorage.setItem("jerseyColor", jerseyColor);
  showMsg("Saved!");
}

/* RELOAD */
function reloadData() {
  players = JSON.parse(localStorage.getItem("team")) || [...defaultPlayers];
  input.value = localStorage.getItem("teamName") || "";
  jerseyColor = localStorage.getItem("jerseyColor") || "#8b0000";
  colorPicker.value = jerseyColor;
  render();
  showMsg("Reloaded!");
}

/* RESET */
function resetAll() {
  if (!confirm("Reset everything?")) return;
  localStorage.clear();
  players = [...defaultPlayers];
  input.value = "";
  jerseyColor = "#8b0000";
  colorPicker.value = jerseyColor;
  render();
  showMsg("Reset complete");
}

/* IMAGE DOWNLOAD */
function downloadImage() {
  html2canvas(pitch).then(canvas => {
    const link = document.createElement("a");
    link.download = "lineup.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}

/* SHARE (mobile) */
function shareImage() {
  html2canvas(pitch).then(canvas => {
    canvas.toBlob(blob => {
      const file = new File([blob], "lineup.png", { type: "image/png" });

      if (navigator.share) {
        navigator.share({
          title: "Team Lineup",
          files: [file]
        });
      } else {
        alert("Sharing not supported. Use Download instead.");
      }
    });
  });
}

/* COLOR */
colorPicker.oninput = () => {
  jerseyColor = colorPicker.value;
  render();
};

/* JERSEY */
function jersey(n) {
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
    fill="${jerseyColor}"/>
    <text x="32" y="32" class="number">${n}</text>
  </svg>`;
}

/* RENDER */
function render() {
  document.querySelectorAll(".player").forEach(e => e.remove());

  players.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "player p" + (i+1);
    d.innerHTML = jersey(i+1) + `<div class="name">${name}</div>`;

    d.onclick = () => {
      let n = prompt("Edit player:", name);
      if (n && n.trim()) {
        players[i] = n;
        render();
      }
    };

    pitch.appendChild(d);
  });
}

function showMsg(t) {
  msg.innerText = t;
  setTimeout(() => msg.innerText = "", 1500);
}

render();
</script>

</body>
</html>
