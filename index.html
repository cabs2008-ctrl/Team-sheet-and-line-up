<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Lineup</title>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial;
}

.pitch {
  width: 350px;
  height: 600px;
  background: #e0e0e0;
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
}

/* player */
.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
}

.shirt {
  width: 40px;
  height: 40px;
  background: #8b0000;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
}

.name {
  background: #2e7d32;
  color: white;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 12px;
  margin-top: 4px;
}

/* positioning (approx like your image) */
.p1 { bottom: 10px; left: 50%; transform: translateX(-50%); }

.p2 { bottom: 100px; right: 20px; }
.p3 { bottom: 100px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 100px; left: 20px; }

.p5 { bottom: 180px; right: 20px; }
.p6 { bottom: 180px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 180px; left: 20px; }

.p8 { bottom: 260px; right: 60px; }
.p9 { bottom: 260px; left: 60px; }

.p10 { bottom: 340px; right: 20px; }
.p11 { bottom: 340px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 340px; left: 20px; }

.p13 { top: 40px; right: 20px; }
.p14 { top: 40px; left: 50%; transform: translateX(-50%); }
.p15 { top: 40px; left: 20px; }

</style>
</head>

<body>

<div class="pitch" id="pitch"></div>

<script>
const defaultPlayers = [
  "1 Keeper",
  "2 Player","3 Player","4 Player",
  "5 Player","6 Player","7 Player",
  "8 Player","9 Player",
  "10 Player","11 Player","12 Player",
  "13 Player","14 Player","15 Player"
];

let players = JSON.parse(localStorage.getItem("team")) || defaultPlayers;

const pitch = document.getElementById("pitch");

function render() {
  pitch.innerHTML = "";

  players.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "player p" + (i + 1);

    div.innerHTML = `
      <div class="shirt">${i+1}</div>
      <div class="name">${name}</div>
    `;

    div.onclick = () => editPlayer(i);
    pitch.appendChild(div);
  });
}

function editPlayer(i) {
  const newName = prompt("Edit player name:", players[i]);
  if (newName && newName.trim()) {
    players[i] = newName;
    localStorage.setItem("team", JSON.stringify(players));
    render();
  }
}

render();
</script>

</body>
</html>
