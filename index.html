<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Lineup</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body {
  margin:0;
  background:#00c853;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* TABS */
.tabs{
  display:flex;
  width:100%;
  max-width:420px;
}
.tab{
  flex:1;
  padding:10px;
  text-align:center;
  background:#2e7d32;
  color:white;
  cursor:pointer;
}
.tab.active{background:#1b5e20}

/* SECTIONS */
.section{display:none;width:100%;max-width:420px;}
.section.active{display:block}

/* HEADER */
.header{text-align:center;padding:10px;}
#teamName{
  width:90%;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* BUTTONS */
.btn-group{display:flex;flex-wrap:wrap;justify-content:center;}
.btn{
  flex:1 1 45%;
  margin:4px;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
}

.reload{background:#2e7d32}
.reset{background:#c62828}
.download{background:#ff9800}
.share{background:#25D366}
.store{background:#6a1b9a}

/* PITCH */
.pitch{
  width:95vw;
  max-width:400px;
  aspect-ratio:90/140;
  background:repeating-linear-gradient(#4caf50 0 40px,#43a047 40px 80px);
  border:5px solid #bdbdbd;
  border-radius:10px;
  position:relative;
}

/* LINES */
.lines *{stroke:white;stroke-width:0.6;fill:none}

/* PLAYERS */
.player{position:absolute;text-align:center;cursor:pointer}
.jersey{width:40px}
.number{
  fill:black;
  font-size:12px;
  font-weight:bold;
  text-anchor:middle;
}
.name{
  background:#1b5e20;
  color:white;
  font-size:10px;
  border-radius:10px;
}

/* POSITIONS */
.p1{bottom:2%;left:50%;transform:translateX(-50%)}
.p2{bottom:18%;right:5%}
.p3{bottom:18%;left:50%;transform:translateX(-50%)}
.p4{bottom:18%;left:5%}
.p5{bottom:32%;right:5%}
.p6{bottom:32%;left:50%;transform:translateX(-50%)}
.p7{bottom:32%;left:5%}
.p8{bottom:45%;right:20%}
.p9{bottom:45%;left:20%}
.p10{bottom:60%;right:5%}
.p11{bottom:60%;left:50%;transform:translateX(-50%)}
.p12{bottom:60%;left:5%}
.p13{top:10%;right:5%}
.p14{top:10%;left:50%;transform:translateX(-50%)}
.p15{top:10%;left:5%}

/* SAVED LIST */
.saved-item{
  background:white;
  margin:5px;
  padding:8px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<div class="tabs">
  <div class="tab active" onclick="showTab('lineup',this)">Lineup</div>
  <div class="tab" onclick="showTab('saved',this)">Saved Teams</div>
</div>

<!-- LINEUP -->
<div id="lineup" class="section active">

<div class="header">
  <input id="teamName" placeholder="Team Name">

  <div class="btn-group">
    <button class="btn reload" onclick="reloadData()">Reload</button>
    <button class="btn reset" onclick="resetAll()">Reset</button>
    <button class="btn download" onclick="downloadImage()">Download</button>
    <button class="btn share" onclick="shareImage()">Share</button>
    <button class="btn store" onclick="storeTeam()">Save Team</button>
  </div>

  Jersey Color: <input type="color" id="colorPicker">
</div>

<div class="pitch" id="pitch">
<svg class="lines" viewBox="0 0 90 140">
  <rect x="0" y="0" width="90" height="140"/>
  <line x1="0" y1="70" x2="90" y2="70"/>
</svg>
</div>

</div>

<!-- SAVED -->
<div id="saved" class="section">
  <div id="savedList"></div>
</div>

<script>
const defaultPlayers=Array(15).fill("Player");
defaultPlayers[0]="Goalkeeper";

let players=[...defaultPlayers];
let jerseyColor="#8b0000";

const pitch=document.getElementById("pitch");
const input=document.getElementById("teamName");
const colorPicker=document.getElementById("colorPicker");

/* TAB SWITCH */
function showTab(id,el){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
}

/* RELOAD */
function reloadData(){
  players=JSON.parse(localStorage.getItem("team"))||players;
  input.value=localStorage.getItem("teamName")||"";
  jerseyColor=localStorage.getItem("jerseyColor")||"#8b0000";
  colorPicker.value=jerseyColor;
  render();
}

/* RESET */
function resetAll(){
  if(!confirm("Reset everything?"))return;
  localStorage.clear();
  players=[...defaultPlayers];
  input.value="";
  jerseyColor="#8b0000";
  colorPicker.value=jerseyColor;
  render();
}

/* SAVE TEAM */
function storeTeam(){
  let name=prompt("Team name?");
  if(!name)return;

  let saved=JSON.parse(localStorage.getItem("teams")||"[]");

  saved.push({
    name,
    players,
    jerseyColor
  });

  localStorage.setItem("teams",JSON.stringify(saved));
  renderSaved();
}

/* RENDER SAVED */
function renderSaved(){
  let list=document.getElementById("savedList");
  list.innerHTML="";

  let saved=JSON.parse(localStorage.getItem("teams")||"[]");

  saved.forEach((t,i)=>{
    let div=document.createElement("div");
    div.className="saved-item";
    div.innerHTML=`
      <span>${t.name}</span>
      <div>
        <button onclick="loadTeam(${i})">Load</button>
        <button onclick="deleteTeam(${i})">X</button>
      </div>`;
    list.appendChild(div);
  });
}

/* LOAD */
function loadTeam(i){
  let saved=JSON.parse(localStorage.getItem("teams"));
  let t=saved[i];

  players=t.players;
  jerseyColor=t.jerseyColor;
  colorPicker.value=jerseyColor;
  render();

  showTab("lineup",document.querySelectorAll(".tab")[0]);
}

/* DELETE */
function deleteTeam(i){
  let saved=JSON.parse(localStorage.getItem("teams"));
  saved.splice(i,1);
  localStorage.setItem("teams",JSON.stringify(saved));
  renderSaved();
}

/* IMAGE */
function downloadImage(){
  html2canvas(pitch).then(c=>{
    let a=document.createElement("a");
    a.href=c.toDataURL();
    a.download="lineup.png";
    a.click();
  });
}

/* SHARE */
function shareImage(){
  html2canvas(pitch).then(c=>{
    c.toBlob(b=>{
      let f=new File([b],"lineup.png",{type:"image/png"});
      if(navigator.share){
        navigator.share({files:[f]});
      }
    });
  });
}

/* COLOR */
colorPicker.oninput=()=>{
  jerseyColor=colorPicker.value;
  render();
};

/* ✅ FIX HERE */
function jersey(n){
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
    fill="${jerseyColor}"/>
    <text x="32" y="32" dy=".35em" class="number">${n}</text>
  </svg>`;
}

/* RENDER */
function render(){
  document.querySelectorAll(".player").forEach(e=>e.remove());

  players.forEach((p,i)=>{
    let d=document.createElement("div");
    d.className="player p"+(i+1);
    d.innerHTML=jersey(i+1)+`<div class="name">${p}</div>`;
    d.onclick=()=>{
      let n=prompt("Edit",p);
      if(n){players[i]=n;render();}
    };
    pitch.appendChild(d);
  });
}

render();
renderSaved();
</script>

</body>
</html>
