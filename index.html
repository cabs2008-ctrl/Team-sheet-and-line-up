<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Lineup</title>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial;
}

/* HEADER */
.header {
  margin: 20px;
  text-align: center;
}

#teamName {
  font-size: 24px;
  font-weight: bold;
  padding: 8px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

/* PITCH */
.pitch {
  width: 350px;
  height: 600px;
  background: #e0e0e0;
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

/* PITCH LINES */
.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* PLAYER */
.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
  z-index: 1;
}

/* JERSEY */
.jersey {
  width: 45px;
  height: 45px;
}

.number {
  fill: white;
  font-size: 14px;
  font-weight: bold;
  text-anchor: middle;
  dominant-baseline: middle;
}

.name {
  background: #2e7d32;
  color: white;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 12px;
  margin-top: 4px;
}

/* POSITIONS */
.p1 { bottom: 10px; left: 50%; transform: translateX(-50%); }

.p2 { bottom: 100px; right: 20px; }
.p3 { bottom: 100px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 100px; left: 20px; }

.p5 { bottom: 180px; right: 20px; }
.p6 { bottom: 180px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 180px; left: 20px; }

.p8 { bottom: 260px; right: 60px; }
.p9 { bottom: 260px; left: 60px; }

.p10 { bottom: 340px; right: 20px; }
.p11 { bottom: 340px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 340px; left: 20px; }

.p13 { top: 40px; right: 20px; }
.p14 { top: 40px; left: 50%; transform: translateX(-50%); }
.p15 { top: 40px; left: 20px; }

</style>
</head>

<body>

<div class="header">
  <input id="teamName" placeholder="Enter Team Name">
</div>

<div class="pitch" id="pitch">

  <!-- PITCH LINES -->
  <svg class="lines" viewBox="0 0 100 160" preserveAspectRatio="none">

    <!-- Outer border -->
    <rect x="1" y="1" width="98" height="158" fill="none" stroke="#bdbdbd" stroke-width="1"/>

    <!-- Halfway line -->
    <line x1="0" y1="80" x2="100" y2="80" stroke="#bdbdbd" stroke-width="1"/>

    <!-- Center circle -->
    <circle cx="50" cy="80" r="12" fill="none" stroke="#bdbdbd" stroke-width="1"/>

    <!-- Top penalty box -->
    <rect x="20" y="1" width="60" height="30" fill="none" stroke="#bdbdbd" stroke-width="1"/>

    <!-- Top goal area -->
    <rect x="35" y="1" width="30" height="15" fill="none" stroke="#bdbdbd" stroke-width="1"/>

    <!-- Bottom penalty box -->
    <rect x="20" y="129" width="60" height="30" fill="none" stroke="#bdbdbd" stroke-width="1"/>

    <!-- Bottom goal area -->
    <rect x="35" y="144" width="30" height="15" fill="none" stroke="#bdbdbd" stroke-width="1"/>

  </svg>

</div>

<script>
const defaultPlayers = [
  "Goalkeeper",
  "Player","Player","Player",
  "Player","Player","Player",
  "Midfield","Midfield",
  "Forward","Forward","Forward",
  "Forward","Forward","Forward"
];

let players = JSON.parse(localStorage.getItem("team")) || defaultPlayers;
let teamName = localStorage.getItem("teamName") || "";

const pitch = document.getElementById("pitch");
const teamInput = document.getElementById("teamName");

teamInput.value = teamName;

teamInput.addEventListener("input", () => {
  localStorage.setItem("teamName", teamInput.value);
});

/* JERSEY SVG */
function jerseySVG(number) {
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
          fill="#8b0000"/>
    <text x="32" y="32" class="number">${number}</text>
  </svg>
  `;
}

function render() {
  // remove old players only (keep SVG lines)
  document.querySelectorAll(".player").forEach(el => el.remove());

  players.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "player p" + (i + 1);

    div.innerHTML = `
      ${jerseySVG(i+1)}
      <div class="name">${name}</div>
    `;

    div.onclick = () => editPlayer(i);
    pitch.appendChild(div);
  });
}

function editPlayer(i) {
  const newName = prompt("Edit player name:", players[i]);
  if (newName && newName.trim()) {
    players[i] = newName;
    localStorage.setItem("team", JSON.stringify(players));
    render();
  }
}

render();
</script>

</body>
</html>
