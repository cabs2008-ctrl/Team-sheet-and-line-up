<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAA Lineup</title>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial;
}

.header { margin: 20px; text-align: center; }

#teamName {
  font-size: 22px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  text-align: center;
  margin-bottom: 10px;
}

/* SAVE BUTTON */
.save-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  background: #1e88e5;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.save-msg {
  margin-top: 6px;
  font-size: 12px;
  color: #333;
}

/* PITCH */
.pitch {
  width: 360px;
  height: 560px;
  background: #e6e6e6;
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
  z-index: 1;
}

.jersey { width: 40px; height: 40px; }

.number {
  fill: white;
  font-size: 13px;
  font-weight: bold;
  text-anchor: middle;
  dominant-baseline: middle;
}

.name {
  background: #2e7d32;
  color: white;
  padding: 2px 6px;
  border-radius: 10px;
  font-size: 11px;
  margin-top: 3px;
}

/* POSITIONS */
.p1 { bottom: 8px; left: 50%; transform: translateX(-50%); }
.p2 { bottom: 90px; right: 20px; }
.p3 { bottom: 90px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 90px; left: 20px; }
.p5 { bottom: 170px; right: 20px; }
.p6 { bottom: 170px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 170px; left: 20px; }
.p8 { bottom: 250px; right: 60px; }
.p9 { bottom: 250px; left: 60px; }
.p10 { bottom: 330px; right: 20px; }
.p11 { bottom: 330px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 330px; left: 20px; }
.p13 { top: 50px; right: 20px; }
.p14 { top: 50px; left: 50%; transform: translateX(-50%); }
.p15 { top: 50px; left: 20px; }

</style>
</head>

<body>

<div class="header">
  <input id="teamName" placeholder="Team Name">
  <br>
  <button class="save-btn" onclick="saveData()">Save</button>
  <div class="save-msg" id="saveMsg"></div>
</div>

<div class="pitch" id="pitch">

<svg class="lines" viewBox="0 0 90 140" preserveAspectRatio="none">

  <rect x="0.5" y="0.5" width="89" height="139" fill="none" stroke="#bdbdbd"/>

  <line x1="0" y1="70" x2="90" y2="70" stroke="#bdbdbd"/>

  <line x1="0" y1="45" x2="90" y2="45"/>
  <line x1="0" y1="95" x2="90" y2="95"/>

  <line x1="0" y1="20" x2="90" y2="20"/>
  <line x1="0" y1="120" x2="90" y2="120"/>

  <line x1="0" y1="13" x2="90" y2="13"/>
  <line x1="0" y1="127" x2="90" y2="127"/>

  <rect x="25" y="0" width="40" height="13" fill="none"/>
  <rect x="25" y="127" width="40" height="13" fill="none"/>

  <rect x="38" y="0" width="14" height="4.5" fill="none"/>
  <rect x="38" y="135.5" width="14" height="4.5" fill="none"/>

  <path d="M25 20 A20 20 0 0 0 65 20" fill="none"/>
  <path d="M25 120 A20 20 0 0 1 65 120" fill="none"/>

  <!-- GOALS (correct orientation) -->
  <line x1="43" y1="0" x2="43" y2="7"/>
  <line x1="47" y1="0" x2="47" y2="7"/>
  <line x1="43" y1="7" x2="47" y2="7"/>
  <rect x="43" y="-5" width="4" height="5" fill="none"/>

  <line x1="43" y1="140" x2="43" y2="133"/>
  <line x1="47" y1="140" x2="47" y2="133"/>
  <line x1="43" y1="133" x2="47" y2="133"/>
  <rect x="43" y="140" width="4" height="5" fill="none"/>

</svg>

</div>

<script>
let players = JSON.parse(localStorage.getItem("team")) || Array(15).fill("Player");
players[0] = players[0] || "Goalkeeper";

let teamName = localStorage.getItem("teamName") || "";

const pitch = document.getElementById("pitch");
const input = document.getElementById("teamName");
const saveMsg = document.getElementById("saveMsg");

input.value = teamName;

/* SAVE BUTTON FUNCTION */
function saveData() {
  localStorage.setItem("team", JSON.stringify(players));
  localStorage.setItem("teamName", input.value);

  saveMsg.innerText = "Saved!";
  setTimeout(() => saveMsg.innerText = "", 1500);
}

/* JERSEY */
function jersey(n) {
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
    fill="#8b0000"/>
    <text x="32" y="32" class="number">${n}</text>
  </svg>`;
}

/* RENDER */
function render() {
  document.querySelectorAll(".player").forEach(e => e.remove());

  players.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "player p" + (i+1);
    d.innerHTML = jersey(i+1) + `<div class="name">${name}</div>`;

    d.onclick = () => {
      let n = prompt("Edit player:", name);
      if (n && n.trim()) {
        players[i] = n;
        render();
      }
    };

    pitch.appendChild(d);
  });
}

render();
</script>

</body>
</html>
