<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAA Lineup</title>

<style>
body {
  margin: 0;
  background: #00c853;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial;
}

.header { margin: 20px; }

#teamName {
  font-size: 24px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

/* PITCH */
.pitch {
  width: 360px;
  height: 640px;
  background: #e6e6e6;
  border: 6px solid #bdbdbd;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}

.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.player {
  position: absolute;
  text-align: center;
  cursor: pointer;
  z-index: 1;
}

.jersey { width: 44px; height: 44px; }

.number {
  fill: white;
  font-size: 14px;
  font-weight: bold;
  text-anchor: middle;
  dominant-baseline: middle;
}

.name {
  background: #2e7d32;
  color: white;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 12px;
  margin-top: 4px;
}

/* POSITIONS */
.p1 { bottom: 10px; left: 50%; transform: translateX(-50%); }
.p2 { bottom: 110px; right: 20px; }
.p3 { bottom: 110px; left: 50%; transform: translateX(-50%); }
.p4 { bottom: 110px; left: 20px; }
.p5 { bottom: 200px; right: 20px; }
.p6 { bottom: 200px; left: 50%; transform: translateX(-50%); }
.p7 { bottom: 200px; left: 20px; }
.p8 { bottom: 300px; right: 70px; }
.p9 { bottom: 300px; left: 70px; }
.p10 { bottom: 400px; right: 20px; }
.p11 { bottom: 400px; left: 50%; transform: translateX(-50%); }
.p12 { bottom: 400px; left: 20px; }
.p13 { top: 60px; right: 20px; }
.p14 { top: 60px; left: 50%; transform: translateX(-50%); }
.p15 { top: 60px; left: 20px; }

</style>
</head>

<body>

<div class="header">
  <input id="teamName" placeholder="Team Name">
</div>

<div class="pitch" id="pitch">

<svg class="lines" viewBox="0 0 100 160" preserveAspectRatio="none">

  <!-- BORDER -->
  <rect x="1" y="1" width="98" height="158" fill="none" stroke="#bdbdbd"/>

  <!-- HALF WAY -->
  <line x1="0" y1="80" x2="100" y2="80" stroke="#bdbdbd"/>

  <!-- 45m -->
  <line x1="0" y1="51" x2="100" y2="51" stroke="#bdbdbd"/>
  <line x1="0" y1="109" x2="100" y2="109" stroke="#bdbdbd"/>

  <!-- 20m -->
  <line x1="0" y1="32" x2="100" y2="32" stroke="#bdbdbd"/>
  <line x1="0" y1="128" x2="100" y2="128" stroke="#bdbdbd"/>

  <!-- 13m -->
  <line x1="0" y1="21" x2="100" y2="21" stroke="#bdbdbd"/>
  <line x1="0" y1="139" x2="100" y2="139" stroke="#bdbdbd"/>

  <!-- BIG RECT -->
  <rect x="25" y="0" width="50" height="32" fill="none" stroke="#bdbdbd"/>
  <rect x="25" y="128" width="50" height="32" fill="none" stroke="#bdbdbd"/>

  <!-- SMALL RECT -->
  <rect x="35" y="0" width="30" height="21" fill="none" stroke="#bdbdbd"/>
  <rect x="35" y="139" width="30" height="21" fill="none" stroke="#bdbdbd"/>

  <!-- CORRECT ARC (centered on goal line) -->
  <!-- TOP -->
  <path d="
    M 30 32
    A 20 20 0 0 1 70 32
  " fill="none" stroke="#bdbdbd"/>

  <!-- BOTTOM -->
  <path d="
    M 30 128
    A 20 20 0 0 0 70 128
  " fill="none" stroke="#bdbdbd"/>

  <!-- GOALS -->
  <line x1="45" y1="0" x2="45" y2="10" stroke="#bdbdbd"/>
  <line x1="55" y1="0" x2="55" y2="10" stroke="#bdbdbd"/>

  <line x1="45" y1="160" x2="45" y2="150" stroke="#bdbdbd"/>
  <line x1="55" y1="160" x2="55" y2="150" stroke="#bdbdbd"/>

</svg>

</div>

<script>
let players = JSON.parse(localStorage.getItem("team")) || Array(15).fill("Player");
players[0] = players[0] || "Goalkeeper";

let teamName = localStorage.getItem("teamName") || "";

const pitch = document.getElementById("pitch");
const input = document.getElementById("teamName");

input.value = teamName;
input.oninput = () => localStorage.setItem("teamName", input.value);

function jersey(n) {
  return `
  <svg viewBox="0 0 64 64" class="jersey">
    <path d="M16 8 L24 4 L40 4 L48 8 L56 20 L48 24 L48 56 L16 56 L16 24 L8 20 Z"
    fill="#8b0000"/>
    <text x="32" y="32" class="number">${n}</text>
  </svg>`;
}

function render() {
  document.querySelectorAll(".player").forEach(e => e.remove());

  players.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "player p" + (i+1);
    d.innerHTML = jersey(i+1) + `<div class="name">${name}</div>`;

    d.onclick = () => {
      let n = prompt("Edit player:", name);
      if (n && n.trim()) {
        players[i] = n;
        localStorage.setItem("team", JSON.stringify(players));
        render();
      }
    };

    pitch.appendChild(d);
  });
}

render();
</script>

</body>
</html>
